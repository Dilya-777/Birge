let state={user:null,grade:1,points:0,correct:0,completed:[],assignments:[],reminders:['Сабаққа дайындалу','Кітап оқу','Үзіліс жасау','Су ішу'],settings:{large:false,contrast:false,simple:false,subtitles:true,readAloud:false},page:'home'};
try{const saved=JSON.parse(localStorage.getItem(storeKey)||'null');if(saved)state={...state,...saved}}catch(e){}
const navItems=[['home','🏠','Басты бет'],['world','🌍','Қызықты әлем'],['tasks','📝','Тапсырмалар'],['library','📚','Кітапхана'],['videos','🎬','Бейнесабақ'],['brain','🧠','Жаттығулар'],['relax','🌿','Тынығу'],['teacher','👩‍🏫','Педагог'],['parent','👨‍👩‍👧','Ата-ана'],['friends','🤝','Достар'],['reminders','⏰','Күн тәртібі'],['profile','👤','Профиль']];
function save(){localStorage.setItem(storeKey,JSON.stringify(state))}
function safe(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function setPage(p){state.page=p;save();render()}
function card(icon,title,desc,page){return `<button class="tile" data-page="${page}"><span class="emoji">${icon}</span><b>${title}</b><span class="muted small">${desc}</span></button>`}
function shell(){ $('#auth').classList.add('hidden');$('#workspace').classList.remove('hidden');$('#mobileNav').classList.remove('hidden');document.body.classList.toggle('bigtext',state.settings.large);document.body.classList.toggle('contrast',state.settings.contrast);document.body.classList.toggle('simple',state.settings.simple);$('#userPill').textContent=`${state.user?.name||'Қонақ'} · ${state.user?.role||'Бала'}`; }
function nav(){const make=navItems.map(([p,i,t])=>`<button class="nav ${state.page===p?'active':''}" data-page="${p}"><span>${i}</span><span>${t}</span></button>`).join('');$('#sideNav').innerHTML=make;$('#mobileNav').innerHTML=make}
function render(){shell();nav();const v=$('#view');let g=state.user?.grade||state.grade||1;let content='';
switch(state.page){

break;

case'topic':{let t=topics[state.topicIndex||0];content=`<section class="card"><button class="btn soft" data-page="world">← Қызықты әлемге оралу</button><div class="section-title" style="margin-top:15px"><h2>${t[0]} ${t[1]}</h2></div><p>${t[2]}</p><div class="notice"><b>💡 Қызықты дерек</b><p>${t[3]}</p></div><p><b>🎮 Ойын тапсырмасы</b><br>${t[4]}</p><button class="btn" data-topicquiz>5 сұрақты бастау</button></section>`;break}

case'quiz':content=quizHTML();break;
case'library':content=`<section class="card"><h2>📚 Кітапхана</h2><p class="muted">Пәндер бойынша оқу ресурстарының каталогы. Толық кітап файлдары бұл демоға тіркелмеген.</p>${[['Әліппе және сауат ашу','Әріптер, дыбыстар, буындар'],['Қазақ тілі','Сөз таптары, сөйлем құрау'],['Әдебиеттік оқу','Ертегілер, әңгімелер, өлеңдер'],['Математика','Сандар, амалдар, есептер'],['Дүниетану','Қоғам және қоршаған орта'],['Жаратылыстану','Табиғат, жануарлар, өсімдіктер'],['Инклюзивті қолдау','Қолжетімді оқу әдістері']].map((x,i)=>`<div class="book-item"><b>${['🔤','✍️','📖','➗','🌍','🌿','♿'][i]} ${x[0]}</b><p class="muted small">${x[1]}</p><button class="btn soft small" data-book="${safe(x[0])}">Материалды ашу</button><div id="book-${i}" class="small muted"></div></div>`).join('')}<p class="notice small">Ресми оқулықтарды құқық иесінің рұқсатымен жүктеп, осы каталогқа PDF/EPUB ретінде қосу қажет.</p></section>`;break;
case'videos':content=`<section class="card"><h2>🎬 Бейнесабақтар</h2><p class="muted">Бұл нұсқада нақты видеофайлдар емес, бейнесабаққа арналған түсіндіру жоспарлары берілген.</p>${['Қосу және азайту','Әріп пен буын','Өсімдіктердің өсуі','Ғарыш және ғаламшарлар','Қауіпсіз жол ережесі','Эмоцияларды тану'].map((x,i)=>`<div class="book-item"><b>${['➕','🔤','🌱','🚀','🚦','😊'][i]} ${x}</b><p class="small muted">Қысқа түсіндіру · ${g}-сынып деңгейіне бейімдеуге болады · субтитр мәтіні қарастырылған</p><button class="btn soft small" data-video="${i}">Сабақ сценарийін көру</button></div>`).join('')}<div id="videoDetail"></div></section>`;break;
case'brain':content=`<section class="card"><h2>🧠 Нейрожаттығулар</h2><p class="muted">Қысқа әрі қайталанатын жаттығулар. Балаға үзіліс жасауға мүмкіндік беріңіз.</p><div class="grid">${[['memory','🧠','Есте сақтау','Суреттерді есте сақта'],['odd','🔎','Артық затты тап','Салыстыру'],['sequence','🔢','Реттілікті жалғастыр','Үлгіні байқа'],['emotion','😊','Эмоцияны таны','Көңіл күйді ажырат']].map(x=>`<button class="tile" data-brain="${x[0]}"><span class="emoji">${x[1]}</span><b>${x[2]}</b><span class="muted small">${x[3]}</span></button>`).join('')}</div><div id="brainResult" class="notice hidden" style="margin-top:14px"></div></section>`;break;
case'relax':content=`<section class="card"><h2>🌿 Тынығу және демалыс</h2><div class="video-box"><div style="font-size:42px">🌸</div><h3>Жай тыныс алу</h3><p class="muted">Ыңғайлы отыр. Мұрынмен жай дем ал, содан кейін асықпай дем шығар. Өзіңе қолайлы қарқынды таңда.</p><button class="btn" data-breathe>1 минуттық жаттығуды бастау</button><div id="breathText" aria-live="polite"></div></div><h3>Демалыс идеялары</h3><ul><li>Көзіңді демалдырып, алыстағы затқа қара.</li><li>Су іш.</li><li>Жеңіл қимыл жаса немесе сурет боя.</li><li>Қажет болса, тыныш жерде демал.</li></ul><p class="muted small">Бұл медициналық ем емес, жай демалыс жаттығулары.</p></section>`;break;
case'teacher':content=`<section class="card"><h2>👩‍🏫 Педагог кабинеті</h2><p class="muted">Жаңа тапсырма жоспарын жасап, осы браузерде сақтауға болады.</p><form id="assignForm"><label class="field">Тапсырма атауы<input id="assignTitle" required placeholder="Мысалы: Қосу және азайту"></label><div class="row"><label class="field">Сынып<select id="assignGrade">${[1,2,3,4].map(n=>`<option>${n}</option>`).join('')}</select></label><label class="field">Пән<select id="assignSubject"><option>Математика</option><option>Қазақ тілі</option><option>Дүниетану</option><option>Жаратылыстану</option><option>Логика</option></select></label></div><label class="field">Нұсқаулық<textarea id="assignDesc" rows="3" placeholder="Қысқа нұсқаулық..."></textarea></label><button class="btn">Жоспарды сақтау</button></form><h3>Сақталған жоспарлар</h3>${state.assignments.length?state.assignments.map(a=>`<div class="list-item"><b>${safe(a.title)}</b><div class="muted small">${a.grade}-сынып · ${safe(a.subject)} — ${safe(a.desc)}</div></div>`).join(''):'<p class="muted small">Әзірге жоспар жоқ.</p>'}</section><section class="card"><h3>Педагогке арналған нұсқаулар</h3><ul><li>Бір уақытта бір ғана нұсқаулық беріңіз.</li><li>Қосымша уақыт және үзіліс ұсыныңыз.</li><li>Мәтінді сурет, дыбыс және субтитрмен толықтырыңыз.</li><li>Баланың жеке қажеттілігін ескеріп, ата-анамен келісіңіз.</li></ul></section>`;break;

case'friends':content=`<section class="card"><h2>🤝 Достармен байланыс</h2><p>Достарымен сөйлесу және бірге оқу — маңызды. Балалардың қауіпсіздігі үшін бейнеқоңырау тек ата-ана/мектеп мақұлдаған байланыстар арасында болуы керек.</p><div class="notice">Бұл прототипте нақты бейнеқоңырау іске қосылмаған. Ол үшін қорғалған сервер, шақыру жүйесі және ата-ана келісімі қажет.</div><label class="field">Досқа шақыру коды (демо)<input id="friendCode" placeholder="Мысалы: BIRGE-123"></label><button class="btn" data-friend>Шақыру кодын тексеру</button><div id="friendMsg" class="small muted"></div></section>`;break;
case'reminders':content=`<section class="card"><h2>⏰ Күн тәртібі</h2><p class="muted">Өзіңе керек еске салғыштарды белгіле.</p>${state.reminders.map((r,i)=>`<label class="toggle"><input type="checkbox"> ${safe(r)}</label>`).join('')}<form id="reminderForm" class="row"><input id="reminderNew" placeholder="Жаңа еске салғыш" required><button class="btn">Қосу</button></form><p class="muted small">Бұл — жоспар тізімі. Нақты уақытта push-хабарлама жіберу үшін серверлік хабарландыру қажет.</p></section>`;break;
case'profile':content=`<section class="card"><h2>👤 Менің профилім</h2><p><b>${safe(state.user?.name||'Қонақ')}</b> · ${safe(state.user?.role||'Бала')}</p><p class="muted small">${state.user?.age?state.user.age+' жас · ':''}${state.user?.grade||g}-сынып · ${safe(state.user?.language||'Қазақша')}</p><p>Қызығушылығы: ${safe(state.user?.interests||'Көрсетілмеген')}</p><p>Қолдау қажеттілігі: ${safe(state.user?.needs||'Көрсетілмеген')}</p><hr style="border:0;border-top:1px solid var(--line)"><h3>Қолжетімділік баптаулары</h3>${[['large','Үлкен қаріп'],['contrast','Жоғары контраст'],['simple','Қарапайым көрініс'],['subtitles','Бейнематериалға субтитр'],['readAloud','Мәтінді дыбыстап оқу (браузер қолдаса)']].map(x=>`<label class="toggle"><input type="checkbox" data-setting="${x[0]}" ${state.settings[x[0]]?'checked':''}> ${x[1]}</label>`).join('')}<button class="btn danger" data-logout>Шығу</button></section><section class="card"><h3>Инклюзивті бейімдеу</h3><p class="muted small">Есту ерекшелігі: субтитр және жазбаша нұсқаулық. Көру ерекшелігі: үлкейтілген қаріп, контраст және экран оқырманына үйлесімді мәтін. Сөйлеу ерекшелігі: мәтінмен жауап беру және визуалды таңдау. Әр баланың қажеттілігі жеке бағалануы керек.</p></section>`;break;
}
v.innerHTML=content;
}
let quiz={list:[],i:0,kind:'main',correct:0};
function quizHTML(){let q=quiz.list[quiz.i];if(!q)return `<section class="card"><div style="font-size:45px">🎉</div><h2>Жарайсың! Тапсырма аяқталды.</h2><p>Бұл бөлімдегі дұрыс жауап: ${quiz.correct}/${quiz.list.length}.</p><button class="btn" data-page="${quiz.kind==='topic'?'topic':'tasks'}">Артқа қайту</button></section>`;return `<section class="card"><div class="section-title"><button class="btn soft" data-page="${quiz.kind==='topic'?'topic':'tasks'}">← Артқа</button><span class="tag">${quiz.i+1} / ${quiz.list.length}</span></div><div class="progress"><span style="width:${quiz.i/quiz.list.length*100}%"></span></div><span class="tag">${safe(q[0])}</span><h2 style="margin-top:12px">${safe(q[1])}</h2><div id="choices">${q[2].map((a,i)=>`<button class="choice" data-answer="${i}">${['A','B','C'][i]}. ${safe(a)}</button>`).join('')}</div><div id="answerFeedback" aria-live="polite"></div><button id="nextQ" class="btn hidden" style="margin-top:12px">Келесі сұрақ →</button></section>`}
function startQuiz(list,kind){quiz={list,i:0,kind,correct:0};setPage('quiz')}
function finishAnswer(idx){let q=quiz.list[quiz.i],ok=q[2][idx]===q[3];if(ok){quiz.correct++;state.points+=10;state.correct++;}$('#choices').querySelectorAll('button').forEach(b=>b.disabled=true);$('#answerFeedback').innerHTML=`<div class="${ok?'notice success':'notice'}" style="margin-top:12px"><b>${ok?'Дұрыс! +10 ұпай 🌟':'Тағы бір рет үйреніп көрейік.'}</b><p>${ok?'':`Дұрыс жауап: ${safe(q[3])}. `}${safe(q[4])}</p></div>`;$('#nextQ').classList.remove('hidden');save()}
$('#authForm').addEventListener('submit',e=>{e.preventDefault();state.user={name:$('#fullName').value.trim(),role:$('#role').value,age:$('#age').value,grade:Number($('#grade').value),language:$('#language').value,interests:$('#interests').value,needs:$('#needs').value};state.grade=state.user.grade;save();render()});
$('#guest').addEventListener('click',()=>{state.user={name:'Қонақ',role:'Бала',grade:1,language:'Қазақша',interests:'',needs:'Көрсетілмеген'};save();render()});
document.addEventListener('click',e=>{
const p=e.target.closest('[data-page]');if(p){setPage(p.dataset.page);return}
const topic=e.target.closest('[data-topic]');if(topic){state.topicIndex=Number(topic.dataset.topic);setPage('topic');return}
if(e.target.closest('[data-topicquiz]')){let t=topics[state.topicIndex];startQuiz(t[5].map((q,i)=>['Қызықты әлем',q,[t[6][i],'Басқа жауап','Білмеймін'],t[6][i],t[3]]),'topic');return}
if(e.target.closest('[data-startmain]')){let g=Number($('#gradeSelect').value);state.grade=g;if(state.user)state.user.grade=g;save();startQuiz(tasks[g],'main');return}
const ans=e.target.closest('[data-answer]');if(ans&&state.page==='quiz'&&!ans.disabled){finishAnswer(Number(ans.dataset.answer));return}
if(e.target.id==='nextQ'){quiz.i++;render();return}
const book=e.target.closest('[data-book]');if(book){const parent=book.parentElement;let old=parent.querySelector('.book-detail');if(old)old.remove();let d=document.createElement('p');d.className='book-detail small muted';d.textContent=`${book.dataset.book}: осы бөлімге сынып деңгейіне сай мәтін, сурет, сөздік және қысқа тапсырмалар енгізіледі. Толық кітап файлы әзірге тіркелмеген.`;parent.append(d);return}
const video=e.target.closest('[data-video]');if(video){$('#videoDetail').innerHTML=`<div class="notice" style="margin-top:12px"><b>Сабақ сценарийі: ${['Қосу және азайту','Әріп пен буын','Өсімдіктердің өсуі','Ғарыш және ғаламшарлар','Қауіпсіз жол ережесі','Эмоцияларды тану'][Number(video.dataset.video)]}</b><p>1. Тақырыпты қысқа таныстыру. 2. Бір мысалды суретпен көрсету. 3. Баламен бірге қайталау. 4. Түсінгенін тексеру. 5. Қорытындылау.</p><p>Субтитр мәтіні: мұғалімнің айтқан негізгі нұсқауларын қысқа сөйлемдермен экранда көрсету.</p></div>`;return}
const brain=e.target.closest('[data-brain]');if(brain){let m={memory:'🍎 🐟 🚗 🌳 суреттеріне 10 секунд қара. Енді оларды ретімен атап көр.',odd:'🍎 🍐 🚲 — қайсысы жеміс емес? Дұрыс жауап: велосипед.',sequence:'🔴 🔵 🔴 🔵 ? — келесі белгі 🔴 болады.',emotion:'😊 Бұл — қуаныш эмоциясы. Қуаныш кезінде адам өзін жақсы сезінуі мүмкін.'};$('#brainResult').textContent=m[brain.dataset.brain];$('#brainResult').classList.remove('hidden');return}
if(e.target.closest('[data-breathe]')){let el=$('#breathText');let n=0;el.textContent='Дем ал…';let steps=['Дем ал…','Жай дем шығар…','Денеңді бос ұста…'];let timer=setInterval(()=>{n++;if(n>=6){clearInterval(timer);el.textContent='Жаттығу аяқталды. Жарайсың!';}else el.textContent=steps[n%3]},3000);return}
if(e.target.closest('[data-friend]')){$('#friendMsg').textContent='Демо режимі: шақыру коды тексерілмейді. Нақты достар тізімі мен бейнеқоңырау үшін қауіпсіз сервер қажет.';return}
if(e.target.closest('[data-logout]')){state.user=null;save();$('#workspace').classList.add('hidden');$('#mobileNav').classList.add('hidden');$('#auth').classList.remove('hidden');$('#userPill').textContent='Қонақ режимі';return}
});
document.addEventListener('change',e=>{let k=e.target.dataset.setting;if(k){state.settings[k]=e.target.checked;save();render()}});
document.addEventListener('submit',e=>{if(e.target.id==='assignForm'){e.preventDefault();state.assignments.push({title:$('#assignTitle').value,grade:$('#assignGrade').value,subject:$('#assignSubject').value,desc:$('#assignDesc').value});save();render()}if(e.target.id==='reminderForm'){e.preventDefault();state.reminders.push($('#reminderNew').value.trim());save();render()}});
if(state.user){render()}else{$('#auth').classList.remove('hidden')}
})();
</script>
</body></html>
